name: build-apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q mujaz_project.zip -d _p
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare app
        working-directory: _p/mujaz/app
        run: |
          sed -i "s/YOUR_GITHUB_USER/${{ github.repository_owner }}/; s#/mujaz/main#/${{ github.event.repository.name }}/main#" lib/config.dart
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --org com.mujaz --project-name mujaz --platforms android .
          rm -rf lib
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml
          rm -f test/widget_test.dart
          python3 tool/patch_android_manifest.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build APK
        working-directory: _p/mujaz/app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mujaz-apk
          path: _p/mujaz/app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish news data
        run: |
          mkdir -p data
          cp -r _p/mujaz/data/* data/
          git config user.name "mujaz-bot"
          git config user.email "mujaz-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Add news data" && git push)
